name: Debug Compile Errors

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile main + test sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileDebugKotlin compileDebugUnitTestKotlin --continue --stacktrace > /tmp/out.log 2>&1 || true
      - name: Report errors as issue
        run: bash .github/scripts/post-errors.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
