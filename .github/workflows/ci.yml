name: CI

permissions:
  contents: read
  issues: write
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test & build (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Gradle wrapper is present
        run: |
          bash .github/scripts/fetch-gradle-wrapper.sh 8.9
          chmod +x gradlew

      - name: Unit tests (JVM + Robolectric)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Android Lint (app:lintDebug)
        run: ./gradlew :app:lintDebug --stacktrace 2>&1 | tee /tmp/lint.log
        continue-on-error: false

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

      - name: Assemble debug + release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace 2>&1 | tee -a /tmp/gradle.log

      - name: Verify APKs (package, label, versions)
        run: |
          bash .github/scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
          bash .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: SHA-256 checksums
        run: |
          cd app/build/outputs/apk
          find . -name "*.apk" -print0 | xargs -0 sha256sum | tee "$GITHUB_WORKSPACE/apk-sha256.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khatiyan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: khatiyan-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: apk-sha256
          path: apk-sha256.txt
          retention-days: 30

      - name: Publish failure digest
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/post-ci-failure.sh "$GITHUB_SHA"
