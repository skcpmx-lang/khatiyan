name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is present
        run: |
          bash .github/scripts/fetch-gradle-wrapper.sh 8.9
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KHATIYAN_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KHATIYAN_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "Release signing secrets present — signing with the uploaded keystore."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            # keystore.properties must reference an absolute storeFile path
            echo "$KEYSTORE_PROPERTIES" | sed "s|__KEYSTORE_PATH__|$RUNNER_TEMP/release.keystore|" > keystore.properties
            cat keystore.properties | sed 's/Password=.*/Password=***/' 
          else
            echo "No KHATIYAN_KEYSTORE_BASE64/KHATIYAN_KEYSTORE_PROPERTIES secrets — release will be built with debug signing (see RELEASE.md)."
          fi

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APKs
        run: |
          bash .github/scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
          bash .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release*.apk

      - name: Collect artifacts + checksums
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/khatiyan-debug-${GITHUB_REF_NAME}.apk
          cp app/build/outputs/apk/release/app-release*.apk out/khatiyan-release-${GITHUB_REF_NAME}.apk
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            out/khatiyan-debug-${GITHUB_REF_NAME}.apk \
            out/khatiyan-release-${GITHUB_REF_NAME}.apk \
            out/SHA256SUMS.txt
